[package]
name = "winenv-bootstrapper"
version = "1.1.0"
description = "WinEnv管家 安装引导壳"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"

[profile.release]
opt-level = "s"
lto = true
strip = true
